schema_version: 1

context:
  version: "0.9.2"

package:
  name: sift
  version: ${{ version }}

source:
  url: https://github.com/svent/sift/archive/v${{ version }}.tar.gz
  sha256: d6d8274e475f3f1235eb0118a89f981e0f7741b9f27243d679d3ecd76f68fe03

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - sift --help

about:
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - license-files/
  summary: Fast and powerful open source alternative to grep
  homepage: https://github.com/svent/sift
  repository: https://github.com/svent/sift

extra:
  recipe-maintainers:
    - danielnachun
